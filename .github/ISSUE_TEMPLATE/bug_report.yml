name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. The more concrete you can be, the faster we can act.

  - type: dropdown
    id: affected-surface
    attributes:
      label: Affected surface
      description: Choose the closest user-facing area.
      options:
        - "Scaffold / install"
        - "Setup / Admin"
        - "Content / themes"
        - "Plugins / SDK"
        - "Operations / deploy"
        - "Shop / commerce"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A short description of the bug.
      placeholder: When I ..., I expected ... but got ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include sample code / config when relevant.
      placeholder: |
        1. `pnpm create-nexpress my-site`
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: nexpress-version
    attributes:
      label: NexPress version
      description: The installed version from `pnpm list @nexpress/core --depth 0` or your package.json.
      placeholder: "0.4.3"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: Node version, OS, deployment target (local / Vercel / Fly / self-hosted).
      placeholder: "Node 22.x on macOS, local dev"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      description: Paste sanitized output, including `pnpm run doctor -- --brief --no-color` when relevant. Strip secrets and personal data.
      render: text
    validations:
      required: false
